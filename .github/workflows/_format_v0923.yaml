name: One-time formatting for v0.9.23 hotfix
on:
  push:
    branches:
      - fix/v0.9.23-energy-value-type
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Ruff lint and formatting
        run: |
          python -m pip install ruff==0.15.17
          ruff check --fix custom_components/mypyllant/const.py custom_components/mypyllant/coordinator.py custom_components/mypyllant/hourly_statistics.py custom_components/mypyllant/sensor.py tests/test_controllerless_statistics_only.py
          ruff format custom_components/mypyllant/const.py custom_components/mypyllant/coordinator.py custom_components/mypyllant/hourly_statistics.py custom_components/mypyllant/sensor.py tests/test_controllerless_statistics_only.py
      - name: Commit formatting and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/_format_v0923.yaml
          git add custom_components/mypyllant tests/test_controllerless_statistics_only.py
          git commit -m "style: format valueType bugfix and remove one-time workflow"
          git push
