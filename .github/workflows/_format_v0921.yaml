name: One-time formatting of Vaillant stable release
on:
  push:
    branches:
      - release/v0.9.21
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Apply repository Ruff formatting and import fixes
        run: |
          python -m pip install ruff==0.15.17
          ruff check --fix custom_components/mypyllant/__init__.py custom_components/mypyllant/sensor.py custom_components/mypyllant/hourly_statistics.py tests/test_controllerless_statistics_only.py
          ruff format custom_components/mypyllant/__init__.py custom_components/mypyllant/sensor.py custom_components/mypyllant/hourly_statistics.py tests/test_controllerless_statistics_only.py
      - name: Commit formatting and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/_format_v0921.yaml
          git add custom_components/mypyllant/__init__.py custom_components/mypyllant/sensor.py custom_components/mypyllant/hourly_statistics.py tests/test_controllerless_statistics_only.py
          git commit -m "style: validate Ruff changes and remove temporary formatter"
          git push
