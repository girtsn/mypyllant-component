name: One-time formatter for controllerless monitor
on:
  push:
    branches:
      - feature/controllerless-hourly-only-v0.9.20b2
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Format Python changes with the repository's Ruff version
        run: |
          python -m pip install ruff==0.15.17
          ruff format custom_components/mypyllant tests/test_controllerless_statistics_only.py
      - name: Commit generated formatting, if required
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add custom_components/mypyllant tests/test_controllerless_statistics_only.py
            git commit -m "style: format controllerless monitoring changes"
            git push
          fi
