name: Release controllerless-energy beta

on:
  push:
    branches:
      - 'release/v*'

permissions:
  contents: write

jobs:
  validate:
    name: Run integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version-file: pyproject.toml
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      - name: Install dependencies
        run: uv sync --locked --all-extras --dev
      - name: Verify release version matches manifest
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          expected = os.environ['GITHUB_REF_NAME'].removeprefix('release/')
          actual = json.loads(Path('custom_components/mypyllant/manifest.json').read_text())['version']
          if actual != expected:
              raise SystemExit(f'Release version mismatch: {actual} != {expected}')
          print(f'Validated release {actual}')
          PY
      - name: Check formatting and lint
        run: uv run prek --all-files --skip pytest
      - name: Run tests
        run: uv run pytest

  release:
    name: Publish HACS beta release
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Determine version
        id: version
        shell: bash
        run: |
          echo "tag=${GITHUB_REF_NAME#release/}" >> "$GITHUB_OUTPUT"
      - name: Build HACS ZIP
        uses: thedoctor0/zip-release@0.7.5
        with:
          type: zip
          directory: custom_components/mypyllant
          filename: mypyllant-component.zip
      - name: Publish prerelease (creates version tag)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          draft: false
          prerelease: true
          generate_release_notes: true
          body_path: BETA_RELEASE_NOTES.md
          files: custom_components/mypyllant/mypyllant-component.zip
