name: Validate and format gateway diagnostics proposal

on:
  push:
    branches:
      - feature/controllerless-gateway-diagnostics-0926

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/controllerless-gateway-diagnostics-0926
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
      - run: uv sync --locked --all-extras --dev
      - name: Format only changed Python code
        run: |
          uv run ruff check --fix custom_components/mypyllant/gateway_diagnostics.py tests/test_gateway_diagnostics.py
          uv run ruff format custom_components/mypyllant/gateway_diagnostics.py tests/test_gateway_diagnostics.py
      - name: Commit format fixes to proposal branch
        run: |
          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add custom_components/mypyllant/gateway_diagnostics.py tests/test_gateway_diagnostics.py
            git commit -m 'Format gateway diagnostics with Ruff'
            git push origin HEAD:feature/controllerless-gateway-diagnostics-0926
          fi
      - name: Full style and type checks
        run: uv run prek --all-files --skip pytest
      - name: Full test suite
        run: uv run pytest
