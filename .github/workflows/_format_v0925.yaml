name: One-time format Vaillant v0.9.25 diagnostics
on:
  push:
    branches:
      - feature/v0.9.25-cloud-and-history-diagnostics
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Apply Ruff lint and formatting to changed files
        run: |
          python -m pip install ruff==0.15.17
          ruff check --fix custom_components/mypyllant/connectivity_diagnostics.py custom_components/mypyllant/history_diagnostics.py custom_components/mypyllant/__init__.py custom_components/mypyllant/binary_sensor.py custom_components/mypyllant/sensor.py custom_components/mypyllant/hourly_statistics.py tests/test_diagnostics.py
          ruff format custom_components/mypyllant/connectivity_diagnostics.py custom_components/mypyllant/history_diagnostics.py custom_components/mypyllant/__init__.py custom_components/mypyllant/binary_sensor.py custom_components/mypyllant/sensor.py custom_components/mypyllant/hourly_statistics.py tests/test_diagnostics.py
      - name: Commit formatting and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/_format_v0925.yaml
          git add custom_components/mypyllant tests/test_diagnostics.py
          git commit -m "style: format v0.9.25 diagnostics and remove temporary formatter"
          git push
