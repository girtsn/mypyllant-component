name: Validate v0.9.27 fault details proposal

on:
  push:
    branches:
      - feature/fault-code-details-0927

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/fault-code-details-0927
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
      - run: uv sync --locked --all-extras --dev
      - name: Use repository pinned formatter
        run: uv run prek --all-files --skip pytest || true
      - name: Commit formatting-only changes
        run: |
          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add custom_components/mypyllant/gateway_diagnostics.py tests/test_gateway_diagnostics.py
            git commit -m 'Apply repository pinned fault details formatting'
            git push origin HEAD:feature/fault-code-details-0927
          fi
      - name: Full style and type checks
        run: uv run prek --all-files --skip pytest
      - name: Full integration tests
        run: uv run pytest
